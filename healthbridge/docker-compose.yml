version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: healthbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthbridge_db
      POSTGRES_USER: healthbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbridge -d healthbridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healthbridge-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API Server ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthbridge-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://healthbridge:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/healthbridge_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs

  # ── Background Workers ──────────────────────────────────────
  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthbridge-workers
    restart: unless-stopped
    command: node src/workers/index.js
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://healthbridge:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/healthbridge_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Dashboard (Nginx) ───────────────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: healthbridge-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
  redis_data:
